<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rumbo se mudó · Inventario Maquitop</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://maquitop.github.io/inventario/">
<meta http-equiv="refresh" content="2;url=https://maquitop.github.io/inventario/">
<script>
/* Rumbo ahora vive en maquitop.github.io/inventario: se conserva lo que va después de # (por ejemplo los QR de las constancias, #mov/...) */
(function(){
 try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}catch(e){}
 try{if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});}catch(e){}
 location.replace('https://maquitop.github.io/inventario/'+(location.hash||''));
})();
</script>
<style>
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f7;color:#16222e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{max-width:420px;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{color:#5b6977;line-height:1.5;margin:0 0 18px}
a{display:inline-block;background:#0082c0;color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
<main>
<h1>Rumbo se mudó</h1>
<p>La app de inventario ahora está en <b>maquitop.github.io/inventario</b>. Te llevamos en un momento.</p>
<a href="https://maquitop.github.io/inventario/">Abrir Rumbo</a>
</main>
</body>
</html>
